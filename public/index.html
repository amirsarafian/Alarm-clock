<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلود مستقیم برنامه ساعت زنگ‌دار هوشمند</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 32px 28px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 8px 0;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 24px 0;
        }
        .btn {
            display: block;
            background: #0284c7;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
        }
        .btn:hover {
            background: #0369a1;
            transform: translateY(-2px);
        }
        .meta {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
            background: #0f172a;
            padding: 10px 14px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⏰</div>
        <h1>ساعت زنگ‌دار هوشمند</h1>
        <p>نسخه آماده نصب مستقیم روی اندروید (دقت ۱۰۰٪، افزایش تدریجی صدا و سکوت هوشمند با کلید پاور)</p>
        <a href="/AlarmClock.apk" download="AlarmClock.apk" class="btn">
            📥 دانلود مستقیم فایل APK (حجم: ۲۲ مگابایت)
        </a>
        <div class="meta">
            سازگار با اندروید 8 تا اندروید 16 • بیلد اختصاصی
        </div>
    </div>
</body>
</html>
